<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sout Network | Sign in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/css/adminlte.css" />
  </head>
  <body class="login-page bg-body-secondary">
    <main class="login-box">
      <div class="login-logo"><a href="#"><b>Sout</b> Network</a></div>
      <div class="card">
        <div class="card-body login-card-body">
          <p class="login-box-msg">Distribution &amp; Rights Management Platform</p>
          <div id="loginError" class="alert alert-danger py-2 px-3 mb-3" style="display:none"></div>
          <div id="loginForm">
            <div class="input-group mb-3">
              <input id="loginEmail" type="email" class="form-control" placeholder="Email" autocomplete="username" />
              <div class="input-group-text"><span class="bi bi-envelope"></span></div>
            </div>
            <div class="input-group mb-3">
              <input id="loginPassword" type="password" class="form-control" placeholder="Password" autocomplete="current-password" />
              <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
            </div>
            <div class="d-grid gap-2"><button type="button" id="loginBtn" class="btn btn-primary">Sign In</button></div>
          </div>
          <div id="pwForm" style="display:none">
            <p class="text-secondary mb-3">Choose a new password before continuing.</p>
            <div class="input-group mb-3">
              <input id="np1" type="password" class="form-control" placeholder="New password (8+ characters)" autocomplete="new-password" />
              <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
            </div>
            <div class="input-group mb-3">
              <input id="np2" type="password" class="form-control" placeholder="Repeat new password" autocomplete="new-password" />
              <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
            </div>
            <div class="d-grid gap-2"><button type="button" id="pwBtn" class="btn btn-primary">Set new password</button></div>
          </div>
          <p class="mb-0 mt-3 text-center"><a href="/apply.html">Don't have an account? Apply for one</a></p>
        </div>
      </div>
    </main>
    <script src="/js/adminlte.js"></script>
    <script>
      (function () {
        var $ = function (id) { return document.getElementById(id); };
        var state = { role: null, oldpw: null };
        function showErr(m){ var e=$('loginError'); e.textContent=m; e.style.display=''; }
        function clearErr(){ $('loginError').style.display='none'; }
        async function doLogin(){
          clearErr();
          var email=$('loginEmail').value.trim(), password=$('loginPassword').value;
          if(!email||!password){ showErr('Enter email and password'); return; }
          var b=$('loginBtn'); b.disabled=true; b.textContent='Signing in...';
          try{
            var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});
            var d=await r.json();
            if(!r.ok){ showErr(d.error||'Invalid email or password'); b.disabled=false; b.textContent='Sign In'; return; }
            if(d.user&&d.user.must_change){ state.role=d.user.role; state.oldpw=password; $('loginForm').style.display='none'; document.querySelector('.login-box-msg').textContent='Set a new password'; $('pwForm').style.display=''; return; }
            window.location.href=d.user.role==='admin'?'/admin.html':'/dashboard.html';
          }catch(e){ showErr('Connection error. Try again.'); b.disabled=false; b.textContent='Sign In'; }
        }
        async function doChangePw(){
          clearErr();
          var p1=$('np1').value, p2=$('np2').value;
          if(p1.length<8){ showErr('Password must be at least 8 characters'); return; }
          if(p1!==p2){ showErr('Passwords do not match'); return; }
          var b=$('pwBtn'); b.disabled=true; b.textContent='Saving...';
          try{
            var r=await fetch('/api/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current:state.oldpw,next:p1})});
            var d=await r.json();
            if(!r.ok){ showErr(d.error||'Failed'); b.disabled=false; b.textContent='Set new password'; return; }
            window.location.href=state.role==='admin'?'/admin.html':'/dashboard.html';
          }catch(e){ showErr('Connection error. Try again.'); b.disabled=false; b.textContent='Set new password'; }
        }
        $('loginBtn').addEventListener('click',doLogin);
        $('pwBtn').addEventListener('click',doChangePw);
        $('loginEmail').addEventListener('keydown',function(e){ if(e.key==='Enter')$('loginPassword').focus(); });
        $('loginPassword').addEventListener('keydown',function(e){ if(e.key==='Enter')doLogin(); });
        $('np2').addEventListener('keydown',function(e){ if(e.key==='Enter')doChangePw(); });
      })();
    </script>
  </body>
</html>
